<hgroup>
   <h1>{{ appTitle }}</h1>
   <span class="app-version">&copy; bechryko 2022-{{ currentYear }} - Version {{ appVersion }}</span>
</hgroup>
<nav>
   @for (item of navMenuItems; track $index) {
      <button
         mat-stroked-button
         [disabled]="!item.path"
         (click)="navigateTo(item.path)">
         {{ item.label }}
      </button>
   }
</nav>
