@let name = generatedName();
@if (name) {
   <div class="display-name">
      <p>{{ name }}</p>
      @for (data of displayedGenerationData(); track $index) {
         <p class="generation-data">{{ data[0] }}: {{ data[1] }}</p>
      }
   </div>
   <div class="icons">
      <ngen-interactive-icon
         type="clipboard"
         [data]="name"
         tooltipPosition="left"></ngen-interactive-icon>
      <!-- @if (!nameSaved) {
         <ngen-interactive-icon
            type="saveName"
            [data]="displayName.name"
            (click)="nameSaved = true"
            tooltipPosition="left"></ngen-interactive-icon>
      } -->
   </div>
} @else {
   <p class="no-name-message">Generated names will appear here!</p>
}
