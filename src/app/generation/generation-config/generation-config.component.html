<form
   id="generation-config-wrapper"
   autocomplete="off">
   <fieldset>
      <legend>Generation configuration</legend>
      @if (shouldNoticeBeDisplayed()) {
         <ngen-generation-config-notice [algorithm]="selectedGenerator()"></ngen-generation-config-notice>
      }
      @for (field of configFields; track $index) {
         @if (generatorConfigFields[field.name]) {
            @let configFieldData = configFieldsData[field.name];
            <ngen-input
               [(value)]="configFieldData.value"
               [(disabled)]="configFieldData.disabled"
               [(autoModifyWarningMessage)]="configFieldData.autoModifyWarningMessage"
               [label]="field.label"
               [type]="field.type"
               [disabledTooltip]="field.disabledTooltip"
               [tooltip]="field.tooltip?.()"
               (blur)="onBlur(field)"
               (autoModify)="onAutoModify(field.name)"></ngen-input>
         }
      }
   </fieldset>
</form>
